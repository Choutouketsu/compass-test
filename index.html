<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>炫酷指南针</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 40px 20px;
      overflow: hidden;
    }

    /* 顶部信息面板 */
    .header {
      text-align: center;
      margin-top: 20px;
    }
    .degrees {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }
    .direction {
      font-size: 20px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
    }

    /* 指南针主体容器 */
    .compass-wrapper {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 外发光环 */
    .compass-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(0,0,0,0) 70%);
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.2);
    }

    /* 表盘刻度盘 */
    .compass-dial {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      position: relative;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 盘面刻度与方位字母 */
    .dial-mark {
      position: absolute;
      font-weight: bold;
      font-size: 14px;
      color: #94a3b8;
    }
    .mark-n { top: 10px; color: #f43f5e; font-size: 18px; }
    .mark-s { bottom: 10px; }
    .mark-e { right: 12px; }
    .mark-w { left: 12px; }

    /* 精美指针 */
    .pointer-group {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .needle-n {
      position: absolute;
      top: 30px;
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 95px solid #f43f5e; /* 红枫红：北 */
      filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.6));
    }
    .needle-s {
      position: absolute;
      bottom: 30px;
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 95px solid #94a3b8; /* 银灰：南 */
    }
    .center-hub {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #f8fafc, #cbd5e1);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      z-index: 10;
    }

    /* 底部控制区 */
    .footer {
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="degrees" id="degreeText">0°</div>
    <div class="direction" id="directionText">正北</div>
  </div>

  <div class="compass-wrapper">
    <div class="compass-glow"></div>
    <div class="compass-dial" id="dial">
      <!-- 盘面方位标识 -->
      <span class="dial-mark mark-n">N</span>
      <span class="dial-mark mark-e">E</span>
      <span class="dial-mark mark-s">S</span>
      <span class="dial-mark mark-w">W</span>
      
      <!-- 中心发光指针 -->
      <div class="pointer-group">
        <div class="needle-n"></div>
        <div class="needle-s"></div>
      </div>
    </div>
    <div class="center-hub"></div>
  </div>

  <div class="footer">
    <button class="btn" onclick="requestPermission()">校准 / 开启传感器</button>
  </div>

  <script>
    const dial = document.getElementById('dial');
    const degreeText = document.getElementById('degreeText');
    const directionText = document.getElementById('directionText');

    function getDirectionName(deg) {
      const dirs = ['正北 (N)', '东北 (NE)', '正东 (E)', '东南 (SE)', '正南 (S)', '西南 (SW)', '正西 (W)', '西北 (NW)'];
      const index = Math.round(deg / 45) % 8;
      return dirs[index];
    }

    function handleOrientation(event) {
      let compassHeading = event.alpha;
      
      if (event.webkitCompassHeading) {
        compassHeading = event.webkitCompassHeading;
      }

      if (compassHeading !== null && compassHeading !== undefined) {
        const heading = Math.round(compassHeading);
        // 让整个表盘随方向平滑反向旋转
        dial.style.transform = `rotate(${-heading}deg)`;
        degreeText.innerText = `${heading}°`;
        directionText.innerText = getDirectionName(heading);
      }
    }

    function requestPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          } else {
            alert('需要传感器权限以正常使用指南针');
          }
        });
      } else {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
        alert('已尝试启用方向传感器，请在开阔处平放手机测试。');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      requestPermission();
    });
  </script>
</body>
</html>
