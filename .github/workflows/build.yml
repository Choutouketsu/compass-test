name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create Standard Android Project
      run: |
        # 1. 建立标准目录
        mkdir -p my-app/app/src/main/java/com/example/compass
        mkdir -p my-app/app/src/main/res/values
        mkdir -p my-app/app/src/main/assets

        # 2. 拷贝网页代码
        if [ -d "www" ]; then
          cp -r www/* my-app/app/src/main/assets/
        else
          mkdir -p my-app/app/src/main/assets/
          cp index.html my-app/app/src/main/assets/ || echo "No html found"
        fi

        # 3. 编写清单文件
        cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.compass">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="指南针"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 4. 编写 Java 主代码
        cat << 'EOF' > my-app/app/src/main/java/com/example/compass/MainActivity.java
        package com.example.compass;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        request.grant(request.getResources());
                    }
                });
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        # 5. 编写兼容 Gradle 7.x 的配置
        cat << 'EOF' > my-app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > my-app/settings.gradle
        include ':app'
        EOF

        cat << 'EOF' > my-app/app/build.gradle
        apply plugin: 'com.android.application'
        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.example.compass"
                minSdkVersion 24
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 6. 生成 Wrapper 配置文件锁定版本
        mkdir -p my-app/gradle/wrapper
        cat << 'EOF' > my-app/gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
        zipStoreFile=IMMEDIATE
        zipStorePath=wrapper/dists
        EOF

    - name: Build APK with Gradle Wrapper
      run: |
        cd my-app
        # 强制利用 gradle 命令生成专属的 gradlew 可执行脚本
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compass-app
        path: my-app/app/build/outputs/apk/debug/app-debug.apk
