name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

    - name: Create Capacitor Config
      run: |
        npx cap init "Compass App" "com.example.compass" --web-dir www

    - name: Add Android Platform
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Sync Project
      run: npx cap sync

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configure Tencent Maven Mirror
      run: |
        # 使用sed命令在Android项目的build.gradle中自动加入腾讯云等国内镜像源
        BUILD_FILE="android/build.gradle"
        if [ -f "$BUILD_FILE" ]; then
          sed -i '/repositories {/a \
              maven { url "https://mirrors.cloud.tencent.com/nexus/content/groups/public/" } \
              maven { url "https://maven.aliyun.com/repository/public" } \
              google() \
              mavenCentral()' $BUILD_FILE
          echo "Tencent Maven mirror added successfully!"
        fi

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compass-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
