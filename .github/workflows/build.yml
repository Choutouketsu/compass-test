name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

    - name: Create Capacitor Config
      run: |
        npx cap init "Compass App" "com.example.compass" --web-dir www

    - name: Add Android Platform
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Sync Project
      run: npx cap sync

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Force Gradle Mirror and Clean Caches
      run: |
        # 彻底清理可能损坏的Gradle缓存
        rm -rf ~/.gradle/caches/
        rm -rf ~/.gradle/wrapper/
        
        # 在 Android 项目的 build.gradle 顶部直接强制重写 repositories
        BUILD_G_FILE="android/build.gradle"
        if [ -f "$BUILD_G_FILE" ]; then
          sed -i '1i allprojects { repositories { maven { url "https://mirrors.cloud.tencent.com/nexus/content/groups/public/" } maven { url "https://maven.aliyun.com/repository/public" } google() mavenCentral() } }' $BUILD_G_FILE
          echo "Injected global Tencent/Aliyun mirrors successfully!"
        fi

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compass-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
