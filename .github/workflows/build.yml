name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Capacitor and Create App
      run: |
        npm install -g @capacitor/cli @capacitor/core @capacitor/android
        npx cap init "Compass App" "com.example.compass" --web-dir www
        npm install @capacitor/android
        npx cap add android

    - name: Use Stable Gradle Dependencies
      run: |
        # 移除可能引起下载冲突的第三方加密包，确保使用 Gradle 内置安全库
        ANDROID_BUILD="android/app/build.gradle"
        if [ -f "$ANDROID_BUILD" ]; then
          sed -i '/bcprov/d' $ANDROID_BUILD || true
        fi

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compass-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
