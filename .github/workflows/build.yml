name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 安装与 AGP 7.4.2 匹配的 Gradle 7.5.1（不要用系统自带的 Gradle 9.x）
    - name: Setup Gradle 7.5.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5.1'

    - name: Prepare Android SDK
      run: |
        SDKM=$(command -v sdkmanager || true)
        if [ -z "$SDKM" ]; then
          SDKM=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager -type f 2>/dev/null | head -n 1)
        fi
        if [ -n "$SDKM" ]; then
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1
          "$SDKM" "platforms;android-33" "build-tools;33.0.2" > /dev/null 2>&1 || true
        else
          echo "sdkmanager not found, skip (runner preinstalled SDK is used)"
        fi
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls "$ANDROID_HOME/platforms" 2>/dev/null || true

    - name: Create Android Project
      run: |
        mkdir -p my-app/app/src/main/java/com/example/compass
        mkdir -p my-app/app/src/main/assets
        mkdir -p my-app/app/src/main/res/drawable
        mkdir -p my-app/app/src/main/res/values
        mkdir -p my-app/app/src/main/res/mipmap-anydpi-v26

        # 拷贝网页代码（优先 www/，其次根目录 index.html）
        if [ -f "www/index.html" ]; then
          cp -r www/* my-app/app/src/main/assets/
        elif [ -f "index.html" ]; then
          cp index.html my-app/app/src/main/assets/
        else
          echo "ERROR: 找不到 index.html（请放在仓库根目录或 www/ 目录）"
          exit 1
        fi

        # ---------- AndroidManifest ----------
        cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.compass">
            <application
                android:allowBackup="true"
                android:label="指南针"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # ---------- App 图标（自适应图标，矢量绘制） ----------
        cat << 'EOF' > my-app/app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="ic_launcher_background">#0F172A</color>
        </resources>
        EOF

        cat << 'EOF' > my-app/app/src/main/res/drawable/ic_launcher_foreground.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <!-- 外圈 -->
            <path
                android:fillColor="#00000000"
                android:strokeColor="#38BDF8"
                android:strokeWidth="2.5"
                android:pathData="M54,26 A28,28 0 1,1 54,82 A28,28 0 1,1 54,26 Z" />
            <!-- 东西刻度 -->
            <path
                android:fillColor="#00000000"
                android:strokeColor="#64748B"
                android:strokeWidth="2"
                android:strokeLineCap="round"
                android:pathData="M31,54 L35,54 M73,54 L77,54" />
            <!-- 南针（银灰） -->
            <path
                android:fillColor="#94A3B8"
                android:pathData="M54,77 L61,54 L47,54 Z" />
            <!-- 北针（红） -->
            <path
                android:fillColor="#F43F5E"
                android:pathData="M54,31 L61,54 L47,54 Z" />
            <!-- 中心点 -->
            <path
                android:fillColor="#F8FAFC"
                android:pathData="M54,50 A4,4 0 1,1 54,58 A4,4 0 1,1 54,50 Z" />
        </vector>
        EOF

        cat << 'EOF' > my-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
        </adaptive-icon>
        EOF

        cp my-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
           my-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        # ---------- MainActivity ----------
        cat << 'EOF' > my-app/app/src/main/java/com/example/compass/MainActivity.java
        package com.example.compass;

        import android.app.Activity;
        import android.graphics.Color;
        import android.hardware.Sensor;
        import android.hardware.SensorEvent;
        import android.hardware.SensorEventListener;
        import android.hardware.SensorManager;
        import android.os.Bundle;
        import android.view.WindowManager;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import java.util.Locale;

        public class MainActivity extends Activity implements SensorEventListener {
            private WebView webView;
            private SensorManager sm;
            private Sensor rotationSensor, accelSensor, magnetSensor;
            private boolean pageReady = false;
            private int lastAcc = -1;

            private final float[] rMat = new float[9];
            private final float[] rOut = new float[9];
            private final float[] ori = new float[3];
            private float[] gravity = null;
            private float[] geomagnetic = null;

            /** 网页里的“校准”按钮会调用这里：重启传感器，重新采集磁场数据 */
            public class Bridge {
                @JavascriptInterface
                public void restartSensors() {
                    runOnUiThread(new Runnable() {
                        @Override
                        public void run() {
                            gravity = null;
                            geomagnetic = null;
                            startSensors();
                        }
                    });
                }
            }

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                sm = (SensorManager) getSystemService(SENSOR_SERVICE);
                rotationSensor = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);
                accelSensor = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                magnetSensor = sm.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);

                webView = new WebView(this);
                webView.setBackgroundColor(Color.parseColor("#0f172a"));
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                webView.addJavascriptInterface(new Bridge(), "AndroidCompass");
                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        pageReady = true;
                        lastAcc = -1; // 让下一次传感器事件把精度重新发给网页
                        boolean has = rotationSensor != null || (accelSensor != null && magnetSensor != null);
                        callJs("window.onNativeReady && onNativeReady(" + has + ")");
                    }
                });
                setContentView(webView);
                webView.loadUrl("file:///android_asset/index.html");
            }

            private void startSensors() {
                sm.unregisterListener(this);
                lastAcc = -1;
                if (rotationSensor != null) {
                    sm.registerListener(this, rotationSensor, SensorManager.SENSOR_DELAY_GAME);
                    // 磁力计只用来读取“精度”
                    if (magnetSensor != null) {
                        sm.registerListener(this, magnetSensor, SensorManager.SENSOR_DELAY_GAME);
                    }
                } else if (accelSensor != null && magnetSensor != null) {
                    sm.registerListener(this, accelSensor, SensorManager.SENSOR_DELAY_GAME);
                    sm.registerListener(this, magnetSensor, SensorManager.SENSOR_DELAY_GAME);
                }
            }

            @Override
            protected void onResume() {
                super.onResume();
                startSensors();
            }

            @Override
            protected void onPause() {
                super.onPause();
                sm.unregisterListener(this);
            }

            @Override
            public void onSensorChanged(SensorEvent event) {
                int type = event.sensor.getType();

                if (type == Sensor.TYPE_MAGNETIC_FIELD) {
                    if (event.accuracy != lastAcc) {
                        lastAcc = event.accuracy;
                        callJs("window.setAccuracy && setAccuracy(" + lastAcc + ")");
                    }
                    geomagnetic = event.values.clone();
                    if (rotationSensor != null) return;
                } else if (type == Sensor.TYPE_ACCELEROMETER) {
                    gravity = event.values.clone();
                    if (rotationSensor != null) return;
                }

                boolean ok = false;
                if (type == Sensor.TYPE_ROTATION_VECTOR) {
                    SensorManager.getRotationMatrixFromVector(rMat, event.values);
                    ok = true;
                } else if (rotationSensor == null && gravity != null && geomagnetic != null) {
                    ok = SensorManager.getRotationMatrix(rMat, null, gravity, geomagnetic);
                }
                if (!ok) return;

                float[] m = rMat;
                // 手机竖直持握时换算坐标系，方位角才准确
                if (Math.abs(rMat[8]) < 0.5f) {
                    SensorManager.remapCoordinateSystem(rMat, SensorManager.AXIS_X, SensorManager.AXIS_Z, rOut);
                    m = rOut;
                }
                SensorManager.getOrientation(m, ori);
                float deg = (float) Math.toDegrees(ori[0]);
                deg = (deg + 360f) % 360f;
                callJs(String.format(Locale.US, "window.setHeading && setHeading(%.1f)", deg));
            }

            @Override
            public void onAccuracyChanged(Sensor sensor, int accuracy) {
                // 精度统一在 onSensorChanged 里通过 event.accuracy 上报
            }

            private void callJs(final String js) {
                if (!pageReady) return;
                webView.post(new Runnable() {
                    @Override
                    public void run() {
                        webView.evaluateJavascript(js, null);
                    }
                });
            }
        }
        EOF

        # ---------- Gradle 配置 ----------
        cat << 'EOF' > my-app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > my-app/settings.gradle
        rootProject.name = 'compass'
        include ':app'
        EOF

        cat << 'EOF' > my-app/gradle.properties
        org.gradle.jvmargs=-Xmx2g
        android.useAndroidX=false
        EOF

        # minSdk 26：自适应图标需要 Android 8.0+
        cat << 'EOF' > my-app/app/build.gradle
        apply plugin: 'com.android.application'

        android {
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.example.compass"
                minSdkVersion 26
                targetSdkVersion 33
                versionCode 2
                versionName "1.1"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
        EOF

    - name: Build APK
      run: |
        cd my-app
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compass-app
        path: my-app/app/build/outputs/apk/debug/app-debug.apk
